<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <meta name="author" content="%SITE_NAME%" />
    <meta name="theme-color" content="#05040a" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="%SITE_URL%/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:image" content="%SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%SITE_TITLE%" />
    <meta name="twitter:description" content="%SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="%SITE_URL%/og.jpg" />

    <script type="application/ld+json">%SITE_JSONLD%</script>

    <style>
      /* Paint the right colour before any CSS or JS arrives. */
      html { background: #05040a; color: #ece9f6; }
      .noscript { font: 16px/1.6 system-ui, sans-serif; max-width: 40rem; margin: 20vh auto; padding: 0 1.5rem; }
      .noscript a { color: #b9a3ff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="noscript">
        <h1>%SITE_NAME%</h1>
        <p>%SITE_DESCRIPTION%</p>
        <p>This portfolio needs JavaScript for its 3D scenes, but the projects work on their own:</p>
        <ul>
          <li><a href="/atom/">Atom: an interactive guide to the atom</a></li>
          <li><a href="/animewiki/">AnimeWiki: Anime Hub Dictionary</a></li>
        </ul>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
